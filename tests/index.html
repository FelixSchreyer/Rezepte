<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gut &amp; Grain tests</title>
<link rel="stylesheet" href="../styles/tokens.css">
<style>
  body {
    margin: 0;
    padding: 32px 20px 80px;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans, system-ui, sans-serif);
    font-size: 14px;
    line-height: 1.5;
  }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-family: var(--serif); font-size: 26px; margin: 0 0 4px; }
  .lede { color: var(--ink-soft); margin: 0 0 24px; }
  .lede code { font-size: 12.5px; background: var(--surface-sunk); padding: 2px 5px; border-radius: 4px; }
  h2 {
    font-family: var(--serif); font-size: 17px; font-weight: 600;
    margin: 26px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line);
  }
  .summary {
    font-weight: 600; padding: 12px 16px; border-radius: var(--radius, 10px);
    border: 1px solid var(--line); margin-bottom: 8px;
  }
  .summary.pass { background: rgba(122, 154, 106, 0.14); border-color: #7A9A6A; }
  .summary.fail { background: rgba(176, 74, 42, 0.14); border-color: #B04A2A; }
  .case { padding: 3px 0 3px 2px; }
  .case .mark { display: inline-block; width: 20px; font-weight: 700; }
  .case.pass { color: var(--ink-soft); }
  .case.pass .mark { color: #7A9A6A; }
  .case.fail { color: var(--ink); font-weight: 500; }
  .case.fail .mark { color: #B04A2A; }
  .case pre {
    margin: 6px 0 10px 20px; padding: 10px 12px; white-space: pre-wrap;
    background: var(--surface-sunk); border-left: 2px solid #B04A2A;
    border-radius: 0 6px 6px 0; font-size: 12.5px; color: var(--ink-soft);
  }
</style>
</head>
<body>
<!-- state.js reads this on load; the tests never render into it. -->
<div id="root" hidden></div>

<main>
  <h1>Gut &amp; Grain tests</h1>
  <p class="lede">
    Unit tests for the pure logic (<code>src/lib/recipes.js</code>,
    <code>src/backend/mappers.js</code>) and contract tests for the mock
    backend. Reload to re-run; add <code>?latency=0</code> to skip the mock's
    simulated network delay.
  </p>
  <div id="results">Running…</div>
</main>

<script type="module">
  import { run } from "./harness.js";
  import "./recipes.test.js";
  import "./members.test.js";
  import "./mappers.test.js";
  import "./mock.test.js";
  import "./render.test.js";

  run(document.getElementById("results"));
</script>
</body>
</html>
