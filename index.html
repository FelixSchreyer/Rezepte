<!DOCTYPE html>
<html lang="en">
<head>

<title>Gut &amp; Grain</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Load order matters: tokens define the custom properties everything below uses. -->
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/buttons.css">
<link rel="stylesheet" href="styles/forms.css">

<link rel="stylesheet" href="styles/states.css">
</head>
<body>
<div id="root"></div>

<!--
  Supabase is loaded as a classic UMD script rather than an ES import so that a
  CDN or network failure is catchable: Backend.connect() checks window.supabase
  and falls back to the "Couldn't connect" screen. A failed module import would
  instead abort the whole app before anything renders.
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
