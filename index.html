<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gut &amp; Grain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --bg: #F1F3EC;
    --surface: #FFFFFF;
    --surface-sunk: #E7EBE1;
    --ink: #23291F;
    --ink-soft: #5B6455;
    --ink-faint: #8A927E;
    --line: #DCE1D3;
    --accent: #4C6B4A;
    --accent-ink: #FFFFFF;
    --danger: #A6503A;

    --phase-severe: #A6503A;
    --phase-moderate: #C08A2E;
    --phase-rebuilding: #93893F;
    --phase-transition: #3E7D82;
    --phase-remission: #4E8A54;

    --radius: 10px;
    --serif: "Fraunces", Georgia, serif;
    --sans: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1A1D17;
      --surface: #23271F;
      --surface-sunk: #1F231B;
      --ink: #ECEEE6;
      --ink-soft: #ABB39C;
      --ink-faint: #767F6C;
      --line: #343A2B;
      --accent: #8FB088;
      --accent-ink: #16190F;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1A1D17;
    --surface: #23271F;
    --surface-sunk: #1F231B;
    --ink: #ECEEE6;
    --ink-soft: #ABB39C;
    --ink-faint: #767F6C;
    --line: #343A2B;
    --accent: #8FB088;
    --accent-ink: #16190F;
  }

  a { color: inherit; }
  button { font-family: inherit; }

  .app { max-width: 980px; margin: 0 auto; padding: 0 20px 80px; }

  /* ---------- header ---------- */
  header.top {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg);
    padding-top: calc(18px + env(safe-area-inset-top, 0px));
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
  }
  .top-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand {
    display: flex; align-items: baseline; gap: 8px;
  }
  .brand h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 26px;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .brand .tag {
    font-size: 13px;
    color: var(--ink-faint);
    display: none;
  }
  @media (min-width: 560px) { .brand .tag { display: inline; } }

  .top-actions { display: flex; align-items: center; gap: 10px; }

  .btn {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    padding: 9px 14px;
    border-radius: var(--radius);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--ink-faint); }
  .btn:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .btn-primary {
    background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
  }
  .btn-primary:hover { filter: brightness(1.05); }
  .btn-ghost { background: transparent; border-color: transparent; }
  .btn-ghost:hover { background: var(--surface-sunk); }
  .btn-sm { padding: 6px 10px; font-size: 13px; }
  .btn-block { width: 100%; }

  .profile-chip {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--line);
    background: var(--surface);
    padding: 6px 10px 6px 6px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 13px;
    max-width: 190px;
  }
  .profile-chip .dot {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; flex: none;
  }
  .profile-chip .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
  .profile-chip .who .role { display: block; color: var(--ink-faint); font-size: 11px; }

  /* ---------- phase dropdown ---------- */
  .phase-row {
    display: flex; align-items: center; gap: 10px; margin-top: 16px;
  }
  .phase-row .lbl-inline {
    font-size: 13px; font-weight: 600; color: var(--ink-soft); flex: none;
  }
  .phase-dropdown {
    display: flex; align-items: center; gap: 9px;
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: var(--radius);
    padding: 0 6px 0 12px;
    flex: 1 1 auto;
    max-width: 320px;
  }
  .phase-dropdown-dot {
    width: 10px; height: 10px; border-radius: 50%; flex: none;
  }
  .phase-dropdown select {
    flex: 1 1 auto;
    border: none;
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    padding: 10px 26px 10px 0;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><path d='M5 8l5 5 5-5' fill='none' stroke='%235B6455' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat;
    background-position: right 2px center;
    background-size: 16px;
    cursor: pointer;
  }
  .phase-dropdown select:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  .filters-row {
    display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center;
  }
  .tag-chip {
    border: 1px solid var(--line);
    background: var(--surface);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    color: var(--ink-soft);
  }
  .tag-chip[data-active="true"] {
    background: var(--ink); color: var(--bg); border-color: var(--ink);
  }
  :root[data-theme="dark"] .tag-chip[data-active="true"],
  @media (prefers-color-scheme: dark) { }

  .search-wrap { margin-top: 12px; }
  .search-wrap input {
    width: 100%;
    padding: 11px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-size: 15px;
  }
  .search-wrap input::placeholder { color: var(--ink-faint); }

  /* ---------- grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
    margin-top: 22px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    cursor: pointer;
    text-align: left;
    display: flex; flex-direction: column; gap: 8px;
    border-left-width: 5px;
    border-left-style: solid;
  }
  .card:hover { border-color: var(--ink-faint); }
  .card h3 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 19px;
    margin: 0;
    line-height: 1.25;
  }
  .card .phase-dots { display: flex; gap: 5px; }
  .card .phase-dots span {
    width: 9px; height: 9px; border-radius: 50%;
  }
  .card .meta {
    font-size: 12.5px; color: var(--ink-faint);
  }
  .card .tags {
    font-size: 12.5px; color: var(--ink-soft);
  }
  .card .rating-row {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--ink-soft);
    margin-top: auto;
    padding-top: 6px;
  }
  .stars { color: var(--phase-remission); letter-spacing: 1px; font-size: 14px; }
  .empty-state {
    grid-column: 1 / -1;
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    padding: 36px 24px;
    text-align: center;
    color: var(--ink-soft);
  }
  .empty-state .big { font-family: var(--serif); font-size: 20px; color: var(--ink); margin-bottom: 6px; }

  /* ---------- overlay / modal ---------- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(20, 24, 15, 0.45);
    display: none;
    align-items: stretch; justify-content: flex-end;
    z-index: 100;
  }
  .overlay.show { display: flex; }
  .panel {
    background: var(--bg);
    width: min(520px, 100%);
    height: 100%;
    overflow-y: auto;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 22px calc(32px + env(safe-area-inset-bottom, 0px));
    box-shadow: -8px 0 24px rgba(0,0,0,0.12);
  }
  .panel.center {
    margin: auto;
    height: auto;
    max-height: 90vh;
    border-radius: var(--radius);
    width: min(420px, 92vw);
  }
  .panel-head {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    margin-bottom: 18px;
  }
  .panel-head h2 {
    font-family: var(--serif); font-weight: 600; font-size: 24px; margin: 0;
  }
  .close-x {
    border: none; background: transparent; font-size: 20px; cursor: pointer; color: var(--ink-faint);
    line-height: 1; padding: 4px;
  }

  label.field { display: block; margin-bottom: 16px; }
  label.field .lbl {
    display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--ink);
  }
  label.field .hint { font-weight: 400; color: var(--ink-faint); font-size: 12px; }
  input[type=text], input[type=number], textarea, select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-size: 15px;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 84px; line-height: 1.4; }

  .check-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .check-pill {
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 13px;
    font-size: 13.5px;
    cursor: pointer;
    background: var(--surface);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .check-pill input { accent-color: var(--accent); }
  .check-pill[data-checked="true"] { background: var(--surface-sunk); border-color: var(--ink-faint); }

  .add-tag-row { display: flex; gap: 8px; margin-top: 8px; }
  .add-tag-row input { flex: 1; }

  .form-error { color: var(--danger); font-size: 13px; margin: -8px 0 14px; }

  /* detail panel */
  .detail-phase-dots { display: flex; gap: 6px; margin-bottom: 6px; }
  .detail-phase-dots span {
    font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; color: #fff;
  }
  .detail-section { margin-top: 22px; }
  .detail-section h4 {
    font-family: var(--serif); font-size: 15px; font-weight: 600; margin: 0 0 8px;
    color: var(--ink-soft);
  }
  .ingredient-list { margin: 0; padding-left: 20px; }
  .ingredient-list li { margin-bottom: 4px; }
  .instructions { white-space: pre-wrap; line-height: 1.55; }
  .meta-line { font-size: 13px; color: var(--ink-faint); }

  .rating-item {
    border-top: 1px solid var(--line);
    padding: 12px 0;
  }
  .rating-item .rhead { display: flex; justify-content: space-between; font-size: 13.5px; }
  .rating-item .rhead .who { font-weight: 600; }
  .rating-item .tol {
    display: inline-block; font-size: 11.5px; padding: 2px 8px; border-radius: 999px;
    margin-left: 6px; background: var(--surface-sunk); color: var(--ink-soft);
  }
  .rating-item .comment { margin-top: 4px; font-size: 14px; color: var(--ink-soft); }

  .star-picker { display: flex; gap: 4px; }
  .star-picker button {
    border: none; background: transparent; font-size: 26px; cursor: pointer; color: var(--line); padding: 0;
    line-height: 1;
  }
  .star-picker button[data-on="true"] { color: var(--phase-remission); }

  .tol-picker { display: flex; gap: 8px; }
  .tol-btn {
    flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 9px; font-size: 13px;
    background: var(--surface); cursor: pointer; font-weight: 600; color: var(--ink-soft);
  }
  .tol-btn[data-on="true"] { border-color: var(--ink); color: var(--ink); background: var(--surface-sunk); }

  .helper-banner {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; font-size: 13.5px; color: var(--ink-soft); margin-top: 16px;
  }

  .center-screen {
    min-height: 70vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 40px 20px;
  }
  .center-screen .box { max-width: 380px; }
  .center-screen h2 { font-family: var(--serif); font-size: 22px; margin-bottom: 8px; }
  .center-screen p { color: var(--ink-soft); font-size: 14.5px; line-height: 1.5; }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }

  @media (prefers-reduced-motion: no-preference) {
    .overlay .panel { animation: slidein 0.22s ease-out; }
  }
  @keyframes slidein { from { transform: translateX(16px); opacity: 0; } to { transform: none; opacity: 1; } }
</style>

<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
  "use strict";

  var SUPABASE_URL = "https://akuqozjsbrayrveflksy.supabase.co";
  var SUPABASE_KEY = "sb_publishable_YY-80QlzZlWeXxmdj4mqdw_v8HN2Z38";

  var PHASES = [
    { id: "severe",     label: "Acute — Severe",   short: "Severe",     color: "var(--phase-severe)" },
    { id: "moderate",   label: "Acute — Moderate", short: "Moderate",   color: "var(--phase-moderate)" },
    { id: "rebuilding", label: "Rebuilding",       short: "Rebuilding", color: "var(--phase-rebuilding)" },
    { id: "transition", label: "Transition",       short: "Transition", color: "var(--phase-transition)" },
    { id: "remission",  label: "Remission",        short: "Remission",  color: "var(--phase-remission)" }
  ];
  var PHASE_MAP = {};
  PHASES.forEach(function(p){ PHASE_MAP[p.id] = p; });

  var BASE_TAGS = ["Low-Carb", "Keto", "Gluten-free", "Lactose-free", "Low-FODMAP", "Low-fiber"];

  var TOLERANCE = [
    { id: "good", label: "Well tolerated" },
    { id: "medium", label: "Mixed" },
    { id: "poor", label: "Poorly tolerated" }
  ];
  var TOL_MAP = {}; TOLERANCE.forEach(function(t){ TOL_MAP[t.id] = t; });

  var root = document.getElementById("root");

  var state = {
    ready: false,
    capsMissing: false,
    slowLoad: false,
    uid: null,
    myProfile: null,       // {name, role}
    members: {},           // uid -> {name, role}
    recipes: [],           // [{id, ...data}]
    ratings: [],           // [{id, recipeId, uid, name, stars, tolerance, comment}]
    activePhase: null,
    activeTags: {},        // tag -> true
    search: "",
    modal: null            // {type: 'onboarding'|'add'|'detail', ...}
  };

  /**
   * ============================================================
   *  BACKEND ADAPTER
   * ============================================================
   * Everything that talks to a persistence/auth layer lives in this
   * one object. The rest of the app (rendering, forms, filtering)
   * never touches Supabase or any database API directly — it
   * only calls Backend.* methods below.
   *
   * To move to a different backend later (e.g. Supabase), rewrite the
   * INSIDE of these functions to that backend's API. Nothing outside
   * this object needs to change, as long as the contract stays the same:
   *
   *   connect()                    -> Promise<{ ok: boolean }>
   *   getUid()                     -> Promise<string | null>  (valid after connect())
   *   fetchProfile(uid)            -> Promise<Object | null>
   *   saveProfile(uid, profile)    -> Promise<void>
   *   onMembers(cb)                -> unsubscribe();  cb(Array<{id, ...}>)
   *   onRecipes(cb)                -> unsubscribe();  cb(Array<{id, ...}>)
   *   onRatings(cb)                -> unsubscribe();  cb(Array<{id, ...}>)
   *   addRecipe(data)              -> Promise<void>
   *   upsertRating(recipeId, uid, data) -> Promise<void>
   *   fetchFilterState(uid)        -> Promise<Object | null>
   *   saveFilterState(uid, data)   -> Promise<void>
   *
   * Identity: getUid() transparently creates an anonymous Supabase session
   * on first visit (no email, password, or user action needed) and reuses
   * it on later visits from the same browser. "Signing in" from the
   * person's point of view is just the name+role onboarding step.
   *
   * All ids are opaque strings. All timestamps are numbers (Date.now()).
   * Callers never assume anything about *how* data arrives beyond this
   * contract (no ORM objects, no query builders leak out).
   *
   * BACKEND: Supabase (Postgres + Auth + Realtime).
   * Schema: see gut-and-grain-schema.sql (tables: members, recipes, ratings;
   * row-level security policies; realtime enabled on all three tables).
   */
  var Backend = (function () {
    var sb = null;

    function mapMember(row) {
      return { id: row.id, name: row.name, role: row.role, joinedAt: row.joined_at, lastPhase: row.last_phase };
    }
    function mapRecipe(row) {
      return {
        id: row.id,
        title: row.title,
        phases: row.phases || [],
        tags: row.tags || [],
        ingredients: row.ingredients || [],
        instructions: row.instructions || "",
        prepMinutes: row.prep_minutes,
        addedBy: row.added_by,
        addedByName: row.added_by_name,
        createdAt: row.created_at
      };
    }
    function mapRating(row) {
      return {
        id: row.id,
        recipeId: row.recipe_id,
        uid: row.uid,
        name: row.name,
        stars: row.stars,
        tolerance: row.tolerance,
        comment: row.comment,
        createdAt: row.created_at
      };
    }

    function liveTable(table, mapper, cb) {
      function load() {
        sb.from(table).select("*").then(function (res) {
          if (!res.error) cb((res.data || []).map(mapper));
        });
      }
      load();
      var channel = sb.channel(table + "-changes")
        .on("postgres_changes", { event: "*", schema: "public", table: table }, load)
        .subscribe();
      return function () { sb.removeChannel(channel); };
    }

    return {
      connect: async function () {
        if (!window.supabase || typeof window.supabase.createClient !== "function") {
          return { ok: false };
        }
        try {
          sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
          return { ok: true };
        } catch (e) {
          return { ok: false };
        }
      },

      // Reuses an existing (anonymous) session if there is one; otherwise
      // creates a new anonymous session on the spot. Returns null only if
      // that genuinely fails (e.g. Anonymous sign-ins disabled on the
      // Supabase project, or no network).
      getUid: async function () {
        var res = await sb.auth.getSession();
        var session = res.data && res.data.session;
        if (session) return session.user.id;

        try {
          var signInRes = await sb.auth.signInAnonymously();
          if (signInRes.error || !signInRes.data.user) return null;
          return signInRes.data.user.id;
        } catch (e) {
          return null;
        }
      },

      fetchProfile: async function (uid) {
        try {
          var res = await sb.from("members").select("*").eq("id", uid).maybeSingle();
          return (!res.error && res.data) ? mapMember(res.data) : null;
        } catch (e) {
          return null;
        }
      },

      // Only writes the columns given — omitted columns (e.g. last_phase)
      // are left untouched on an existing row.
      saveProfile: function (uid, profile) {
        return sb.from("members").upsert({
          id: uid,
          name: profile.name,
          role: profile.role,
          joined_at: profile.joinedAt
        });
      },

      onMembers: function (cb) { return liveTable("members", mapMember, cb); },
      onRecipes: function (cb) { return liveTable("recipes", mapRecipe, cb); },
      onRatings: function (cb) { return liveTable("ratings", mapRating, cb); },

      addRecipe: function (data) {
        return sb.from("recipes").insert({
          title: data.title,
          phases: data.phases,
          tags: data.tags,
          ingredients: data.ingredients,
          instructions: data.instructions,
          prep_minutes: data.prepMinutes,
          added_by: data.addedBy,
          added_by_name: data.addedByName,
          created_at: data.createdAt
        });
      },

      upsertRating: function (recipeId, uid, data) {
        return sb.from("ratings").upsert({
          recipe_id: recipeId,
          uid: uid,
          name: data.name,
          stars: data.stars,
          tolerance: data.tolerance,
          comment: data.comment,
          created_at: data.createdAt
        }, { onConflict: "recipe_id,uid" });
      },

      // Private-in-practice per-viewer preference (which phase they last
      // browsed), stored as a nullable column on their own members row.
      fetchFilterState: async function (uid) {
        var profile = await this.fetchProfile(uid);
        return (profile && profile.lastPhase) ? { lastPhase: profile.lastPhase } : null;
      },

      saveFilterState: function (uid, data) {
        return sb.from("members").update({ last_phase: data.lastPhase }).eq("id", uid);
      }
    };
  })();

  function el(tag, opts, children) {
    var node = document.createElement(tag);
    opts = opts || {};
    if (opts.class) node.className = opts.class;
    if (opts.text !== undefined) node.textContent = opts.text;
    if (opts.attrs) for (var k in opts.attrs) node.setAttribute(k, opts.attrs[k]);
    if (opts.style) node.style.cssText = opts.style;
    if (opts.on) for (var ev in opts.on) node.addEventListener(ev, opts.on[ev]);
    (children || []).forEach(function(c){ if (c) node.appendChild(c); });
    return node;
  }

  function initials(name) {
    if (!name) return "?";
    var parts = name.trim().split(/\s+/);
    return (parts[0][0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
  }

  function allTags() {
    var set = {};
    BASE_TAGS.forEach(function(t){ set[t] = true; });
    state.recipes.forEach(function(r){ (r.tags||[]).forEach(function(t){ set[t] = true; }); });
    return Object.keys(set);
  }

  function ratingsFor(recipeId) {
    return state.ratings.filter(function(r){ return r.recipeId === recipeId; });
  }

  function ratingSummary(recipeId) {
    var rs = ratingsFor(recipeId);
    if (!rs.length) return null;
    var sum = 0, tolCount = { good: 0, medium: 0, poor: 0 };
    rs.forEach(function(r){ sum += (r.stars||0); tolCount[r.tolerance] = (tolCount[r.tolerance]||0) + 1; });
    var avg = sum / rs.length;
    var bestTol = "good";
    Object.keys(tolCount).forEach(function(k){ if (tolCount[k] > (tolCount[bestTol]||0)) bestTol = k; });
    return { avg: avg, count: rs.length, tolerance: bestTol };
  }

  function filteredRecipes() {
    var tagFilters = Object.keys(state.activeTags).filter(function(t){ return state.activeTags[t]; });
    var q = state.search.trim().toLowerCase();
    return state.recipes.filter(function(r){
      if (state.activePhase && (r.phases||[]).indexOf(state.activePhase) === -1) return false;
      for (var i = 0; i < tagFilters.length; i++) {
        if ((r.tags||[]).indexOf(tagFilters[i]) === -1) return false;
      }
      if (q) {
        var hay = (r.title || "").toLowerCase() + " " + (r.ingredients||[]).join(" ").toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    }).sort(function(a,b){ return (b.createdAt||0) - (a.createdAt||0); });
  }

  // ---------------- rendering ----------------

  function render() {
    root.innerHTML = "";
    if (state.capsMissing) { root.appendChild(renderCapsMissing()); return; }
    if (!state.ready) { root.appendChild(renderLoading()); return; }
    if (!state.uid) { root.appendChild(renderSignInFailed()); return; }

    var app = el("div", { class: "app" });
    app.appendChild(renderHeader());
    app.appendChild(renderPhaseDropdown());
    app.appendChild(renderFiltersRow());
    app.appendChild(renderSearch());
    app.appendChild(renderGrid());
    root.appendChild(app);

    if (state.modal) {
      root.appendChild(renderModal());
    }

    if (!state.myProfile) {
      openOnboarding(null);
    }
  }

  function renderCapsMissing() {
    return el("div", { class: "center-screen" }, [
      el("div", { class: "box" }, [
        el("h2", { text: "Couldn't connect" }),
        el("p", { text: "Gut & Grain couldn't reach its database. Check your internet connection, or try reloading the page." }),
        el("button", { class: "btn btn-primary", style: "margin-top:16px;", attrs: { type: "button" }, text: "Try again", on: { click: retryInit } })
      ])
    ]);
  }

  function renderLoading() {
    var box = el("div", { class: "box" }, [
      el("h2", { text: "Setting the table…" }),
      el("p", { text: "Connecting to your shared recipe box." })
    ]);
    if (state.slowLoad) {
      box.appendChild(el("p", { style: "margin-top:10px;", text: "This is taking longer than expected." }));
      box.appendChild(el("button", { class: "btn btn-primary", style: "margin-top:6px;", attrs: { type: "button" }, text: "Try again", on: { click: retryInit } }));
    }
    return el("div", { class: "center-screen" }, [box]);
  }

  function retryInit() {
    state.capsMissing = false;
    state.ready = false;
    state.slowLoad = false;
    render();
    init();
  }

  // Only shown if the automatic, silent sign-in itself failed — normally
  // nobody ever sees this screen.
  function renderSignInFailed() {
    return el("div", { class: "center-screen" }, [
      el("div", { class: "box" }, [
        el("h2", { text: "Couldn't sign you in" }),
        el("p", { text: "This usually means \"Anonymous sign-ins\" isn't turned on for the Supabase project yet (Authentication → Sign In / Providers → Anonymous Sign-Ins)." }),
        el("button", { class: "btn btn-primary", style: "margin-top:16px;", attrs: { type: "button" }, text: "Try again", on: { click: retryInit } })
      ])
    ]);
  }

  function renderHeader() {
    var chip;
    if (state.myProfile) {
      chip = el("button", { class: "profile-chip", attrs: { type: "button" }, on: { click: function(){ openOnboarding(state.myProfile); } } }, [
        el("span", { class: "dot", text: initials(state.myProfile.name) }),
        el("span", { class: "who" }, [
          document.createTextNode(state.myProfile.name),
          el("span", { class: "role", text: state.myProfile.role === "patient" ? "Patient" : "Member" })
        ])
      ]);
    } else {
      chip = el("span");
    }

    return el("header", { class: "top" }, [
      el("div", { class: "top-row" }, [
        el("div", { class: "brand" }, [
          el("h1", { text: "Gut & Grain" }),
          el("span", { class: "tag", text: "your family's IBD-friendly recipe box" })
        ]),
        el("div", { class: "top-actions" }, [
          el("button", { class: "btn btn-primary", attrs: { type: "button" }, text: "+ Add recipe", on: { click: openAddRecipe } }),
          chip
        ])
      ])
    ]);
  }

  function setActivePhase(id) {
    state.activePhase = id || null;
    if (state.uid) {
      Backend.saveFilterState(state.uid, { lastPhase: state.activePhase }).catch(function(){});
    }
    render();
  }

  function renderPhaseDropdown() {
    var current = state.activePhase ? PHASE_MAP[state.activePhase] : null;
    var dropdown = el("div", { class: "phase-dropdown" });
    dropdown.appendChild(el("span", { class: "phase-dropdown-dot", style: "background:" + (current ? current.color : "var(--ink-faint)") }));

    var select = el("select", { attrs: { "aria-label": "Filter by phase" } });
    var allCount = state.recipes.length;
    select.appendChild(el("option", { text: "All phases (" + allCount + ")", attrs: { value: "" } }));
    PHASES.forEach(function(p){
      var count = state.recipes.filter(function(r){ return (r.phases||[]).indexOf(p.id) !== -1; }).length;
      select.appendChild(el("option", { text: p.label + " (" + count + ")", attrs: { value: p.id } }));
    });
    select.value = state.activePhase || "";
    select.addEventListener("change", function(e){ setActivePhase(e.target.value); });
    dropdown.appendChild(select);

    return el("div", { class: "phase-row" }, [
      el("span", { class: "lbl-inline", text: "Phase" }),
      dropdown
    ]);
  }

  function renderFiltersRow() {
    var row = el("div", { class: "filters-row" });
    allTags().forEach(function(tag){
      var active = !!state.activeTags[tag];
      var chip = el("button", {
        class: "tag-chip",
        attrs: { type: "button", "aria-pressed": String(active) },
        text: tag,
        on: { click: function(){
          state.activeTags[tag] = !state.activeTags[tag];
          render();
        } }
      });
      chip.dataset.active = String(active);
      row.appendChild(chip);
    });
    return row;
  }

  function renderSearch() {
    var wrap = el("div", { class: "search-wrap" });
    var input = el("input", { attrs: { type: "text", placeholder: "Search recipes or ingredients…", value: state.search, "aria-label": "Search recipes" } });
    input.value = state.search;
    input.addEventListener("input", function(e){
      state.search = e.target.value;
      renderGridInPlace();
    });
    wrap.appendChild(input);
    return wrap;
  }

  function renderGridInPlace() {
    var oldGrid = root.querySelector(".grid");
    var newGrid = renderGrid();
    if (oldGrid) oldGrid.replaceWith(newGrid);
  }

  function emptyCopy() {
    if (state.activePhase) {
      var label = PHASE_MAP[state.activePhase].short;
      return {
        big: "Nothing filed under " + label + " yet",
        small: "Add a recipe that works on " + label.toLowerCase() + " days, so it's ready before the next one starts."
      };
    }
    return {
      big: "The recipe box is empty",
      small: "Add the first recipe — tag it with the phase it suits so it's easy to find later."
    };
  }

  function renderGrid() {
    var grid = el("div", { class: "grid" });
    var list = filteredRecipes();
    if (!list.length) {
      var copy = emptyCopy();
      grid.appendChild(el("div", { class: "empty-state" }, [
        el("div", { class: "big", text: copy.big }),
        el("div", { text: copy.small })
      ]));
      return grid;
    }
    list.forEach(function(r){ grid.appendChild(renderCard(r)); });
    return grid;
  }

  function renderCard(r) {
    var primaryPhase = PHASE_MAP[(r.phases||[])[0]] || PHASES[4];
    var card = el("button", {
      class: "card",
      attrs: { type: "button", style: "" },
      style: "border-left-color:" + primaryPhase.color,
      on: { click: function(){ openDetail(r.id); } }
    });

    var dots = el("div", { class: "phase-dots" });
    (r.phases || []).forEach(function(pid){
      var p = PHASE_MAP[pid];
      if (!p) return;
      dots.appendChild(el("span", { style: "background:" + p.color, attrs: { title: p.label } }));
    });

    card.appendChild(dots);
    card.appendChild(el("h3", { text: r.title || "Untitled recipe" }));
    if ((r.tags||[]).length) {
      card.appendChild(el("div", { class: "tags", text: (r.tags||[]).join(" · ") }));
    }
    card.appendChild(el("div", { class: "meta", text: (r.ingredients||[]).length + " ingredients" + (r.prepMinutes ? " · " + r.prepMinutes + " min" : "") }));

    var summary = ratingSummary(r.id);
    var ratingRow = el("div", { class: "rating-row" });
    if (summary) {
      ratingRow.appendChild(el("span", { class: "stars", text: starString(summary.avg) }));
      ratingRow.appendChild(el("span", { text: summary.avg.toFixed(1) + " · " + TOL_MAP[summary.tolerance].label + " · " + summary.count + " rating" + (summary.count > 1 ? "s" : "") }));
    } else {
      ratingRow.appendChild(el("span", { text: "No ratings yet" }));
    }
    card.appendChild(ratingRow);
    return card;
  }

  function starString(avg) {
    var full = Math.round(avg);
    var s = "";
    for (var i = 0; i < 5; i++) s += (i < full ? "★" : "☆");
    return s;
  }

  // ---------------- modals ----------------

  function closeModal() { state.modal = null; render(); }

  function openOnboarding(prefill) {
    state.modal = { type: "onboarding", name: prefill ? prefill.name : "", role: prefill ? prefill.role : "" , error: "" };
    render();
  }
  function openAddRecipe() {
    state.modal = { type: "add", title: "", phases: {}, tags: {}, customTagInput: "", ingredients: "", instructions: "", prepMinutes: "", error: "" };
    render();
  }
  function openDetail(recipeId) {
    state.modal = { type: "detail", recipeId: recipeId, ratingStars: 0, ratingTol: "", ratingComment: "" };
    render();
  }

  function renderModal() {
    var m = state.modal;
    var centered = (m.type === "onboarding");
    var overlay = el("div", { class: "overlay show", attrs: { role: "dialog", "aria-modal": "true" }, on: { click: function(e){ if (e.target === overlay && m.type !== "onboarding") closeModal(); } } });
    var panel = el("div", { class: "panel" + (centered ? " center" : "") });
    if (m.type === "onboarding") panel.appendChild(renderOnboardingForm(m));
    else if (m.type === "add") panel.appendChild(renderAddForm(m));
    else if (m.type === "detail") panel.appendChild(renderDetail(m));
    overlay.appendChild(panel);
    return overlay;
  }

  function renderOnboardingForm(m) {
    var wrap = el("div");
    var canDismiss = !!state.myProfile;
    var head = el("div", { class: "panel-head" }, [
      el("h2", { text: state.myProfile ? "Your details" : "Welcome to Gut & Grain" }),
      canDismiss ? el("button", { class: "close-x", attrs: { "aria-label": "Close" }, text: "✕", on: { click: closeModal } }) : null
    ]);
    wrap.appendChild(head);
    if (!state.myProfile) {
      wrap.appendChild(el("p", { style: "color:var(--ink-soft); font-size:14px; margin-top:-8px;", text: "Tell us who's cooking, so ratings and recipes carry a name." }));
    }

    var nameField = el("label", { class: "field" }, [
      el("span", { class: "lbl", text: "Your name" })
    ]);
    var nameInput = el("input", { attrs: { type: "text", placeholder: "e.g. Alex" } });
    nameInput.value = m.name;
    nameInput.addEventListener("input", function(e){ m.name = e.target.value; });
    nameField.appendChild(nameInput);
    wrap.appendChild(nameField);

    var roleField = el("label", { class: "field" }, [
      el("span", { class: "lbl" }, [document.createTextNode("Your role "), el("span", { class: "hint", text: "— patients can rate recipes" })])
    ]);
    var roleGrid = el("div", { class: "check-grid" });
    [["member","Member"], ["patient","Patient"]].forEach(function(pair){
      var pill = el("label", { class: "check-pill" }, [
        el("input", { attrs: { type: "radio", name: "role" } }),
        document.createTextNode(pair[1])
      ]);
      var input = pill.querySelector("input");
      input.checked = m.role === pair[0];
      pill.dataset.checked = String(m.role === pair[0]);
      input.addEventListener("change", function(){ m.role = pair[0]; renderModalInPlace(); });
      roleGrid.appendChild(pill);
    });
    roleField.appendChild(roleGrid);
    wrap.appendChild(roleField);

    if (m.error) wrap.appendChild(el("div", { class: "form-error", text: m.error }));

    wrap.appendChild(el("button", {
      class: "btn btn-primary btn-block",
      attrs: { type: "button" },
      text: state.myProfile ? "Save changes" : "Start cooking",
      on: { click: function(){ submitOnboarding(m); } }
    }));
    return wrap;
  }

  function renderModalInPlace() {
    var oldOverlay = root.querySelector(".overlay");
    var newOverlay = renderModal();
    if (oldOverlay) oldOverlay.replaceWith(newOverlay); else root.appendChild(newOverlay);
  }

  function submitOnboarding(m) {
    var name = m.name.trim();
    if (!name) { m.error = "Please enter a name."; renderModalInPlace(); return; }
    if (!m.role) { m.error = "Please choose a role."; renderModalInPlace(); return; }
    m.error = "";
    var profile = { name: name, role: m.role, joinedAt: (state.myProfile && state.myProfile.joinedAt) || Date.now() };
    Backend.saveProfile(state.uid, profile).then(function(){
      state.myProfile = profile;
      closeModal();
    }).catch(function(){
      m.error = "Couldn't save — check your connection and try again.";
      renderModalInPlace();
    });
  }

  function renderAddForm(m) {
    var wrap = el("div");
    wrap.appendChild(el("div", { class: "panel-head" }, [
      el("h2", { text: "Add a recipe" }),
      el("button", { class: "close-x", attrs: { "aria-label": "Close" }, text: "✕", on: { click: closeModal } })
    ]));

    var titleField = el("label", { class: "field" }, [ el("span", { class: "lbl", text: "Title" }) ]);
    var titleInput = el("input", { attrs: { type: "text", placeholder: "e.g. Soft rice congee with poached chicken" } });
    titleInput.value = m.title;
    titleInput.addEventListener("input", function(e){ m.title = e.target.value; });
    titleField.appendChild(titleInput);
    wrap.appendChild(titleField);

    var phaseField = el("label", { class: "field" }, [ el("span", { class: "lbl" }, [document.createTextNode("Suited to phase "), el("span", { class: "hint", text: "— required, pick one or more" })]) ]);
    var phaseGrid = el("div", { class: "check-grid" });
    PHASES.forEach(function(p){
      var pill = el("label", { class: "check-pill" }, [
        el("input", { attrs: { type: "checkbox" } }),
        document.createTextNode(p.label)
      ]);
      var input = pill.querySelector("input");
      input.checked = !!m.phases[p.id];
      pill.dataset.checked = String(!!m.phases[p.id]);
      input.addEventListener("change", function(){
        m.phases[p.id] = input.checked;
        pill.dataset.checked = String(input.checked);
      });
      phaseGrid.appendChild(pill);
    });
    phaseField.appendChild(phaseGrid);
    wrap.appendChild(phaseField);

    var tagField = el("label", { class: "field" }, [ el("span", { class: "lbl" }, [document.createTextNode("Tags "), el("span", { class: "hint", text: "— required, pick or add" })]) ]);
    var tagGrid = el("div", { class: "check-grid" });
    function addTagPill(tag) {
      var pill = el("label", { class: "check-pill" }, [
        el("input", { attrs: { type: "checkbox" } }),
        document.createTextNode(tag)
      ]);
      var input = pill.querySelector("input");
      input.checked = !!m.tags[tag];
      pill.dataset.checked = String(!!m.tags[tag]);
      input.addEventListener("change", function(){
        m.tags[tag] = input.checked;
        pill.dataset.checked = String(input.checked);
      });
      tagGrid.appendChild(pill);
    }
    allTags().forEach(addTagPill);
    tagField.appendChild(tagGrid);

    var addTagRow = el("div", { class: "add-tag-row" });
    var newTagInput = el("input", { attrs: { type: "text", placeholder: "Add a custom tag" } });
    newTagInput.value = m.customTagInput;
    newTagInput.addEventListener("input", function(e){ m.customTagInput = e.target.value; });
    var addTagBtn = el("button", { class: "btn btn-sm", attrs: { type: "button" }, text: "Add", on: { click: function(){
      var t = m.customTagInput.trim();
      if (!t) return;
      m.tags[t] = true;
      m.customTagInput = "";
      addTagPill(t);
      newTagInput.value = "";
    } } });
    addTagRow.appendChild(newTagInput);
    addTagRow.appendChild(addTagBtn);
    tagField.appendChild(addTagRow);
    wrap.appendChild(tagField);

    var ingField = el("label", { class: "field" }, [ el("span", { class: "lbl" }, [document.createTextNode("Ingredients "), el("span", { class: "hint", text: "— required, one per line" })]) ]);
    var ingArea = el("textarea", { attrs: { placeholder: "200g white rice\n1 chicken breast\n1L water\nsalt" } });
    ingArea.value = m.ingredients;
    ingArea.addEventListener("input", function(e){ m.ingredients = e.target.value; });
    ingField.appendChild(ingArea);
    wrap.appendChild(ingField);

    var instField = el("label", { class: "field" }, [ el("span", { class: "lbl" }, [document.createTextNode("Instructions "), el("span", { class: "hint", text: "— optional" })]) ]);
    var instArea = el("textarea", { attrs: { placeholder: "Step by step…" } });
    instArea.value = m.instructions;
    instArea.addEventListener("input", function(e){ m.instructions = e.target.value; });
    instField.appendChild(instArea);
    wrap.appendChild(instField);

    var prepField = el("label", { class: "field" }, [ el("span", { class: "lbl" }, [document.createTextNode("Prep time in minutes "), el("span", { class: "hint", text: "— optional" })]) ]);
    var prepInput = el("input", { attrs: { type: "number", min: "0", placeholder: "20" } });
    prepInput.value = m.prepMinutes;
    prepInput.addEventListener("input", function(e){ m.prepMinutes = e.target.value; });
    prepField.appendChild(prepInput);
    wrap.appendChild(prepField);

    if (m.error) wrap.appendChild(el("div", { class: "form-error", text: m.error }));

    wrap.appendChild(el("button", { class: "btn btn-primary btn-block", attrs: { type: "button" }, text: "Save recipe", on: { click: function(){ submitAddRecipe(m); } } }));
    return wrap;
  }

  function submitAddRecipe(m) {
    var title = m.title.trim();
    var phases = Object.keys(m.phases).filter(function(k){ return m.phases[k]; });
    var tags = Object.keys(m.tags).filter(function(k){ return m.tags[k]; });
    var ingredients = m.ingredients.split("\n").map(function(s){ return s.trim(); }).filter(Boolean);

    if (!title) { m.error = "Please give the recipe a title."; renderModalInPlace(); return; }
    if (!phases.length) { m.error = "Pick at least one phase."; renderModalInPlace(); return; }
    if (!tags.length) { m.error = "Pick or add at least one tag."; renderModalInPlace(); return; }
    if (!ingredients.length) { m.error = "List at least one ingredient."; renderModalInPlace(); return; }

    m.error = "";
    var data = {
      title: title,
      phases: phases,
      tags: tags,
      ingredients: ingredients,
      instructions: m.instructions.trim(),
      prepMinutes: m.prepMinutes ? Number(m.prepMinutes) : null,
      addedBy: state.uid,
      addedByName: (state.myProfile && state.myProfile.name) || "Someone",
      createdAt: Date.now()
    };
    Backend.addRecipe(data).then(function(){
      closeModal();
    }).catch(function(){
      m.error = "Couldn't save — check your connection and try again.";
      renderModalInPlace();
    });
  }

  function renderDetail(m) {
    var r = state.recipes.find(function(x){ return x.id === m.recipeId; });
    var wrap = el("div");
    if (!r) {
      wrap.appendChild(el("div", { class: "panel-head" }, [
        el("h2", { text: "Recipe removed" }),
        el("button", { class: "close-x", text: "✕", on: { click: closeModal } })
      ]));
      return wrap;
    }

    wrap.appendChild(el("div", { class: "panel-head" }, [
      el("h2", { text: r.title }),
      el("button", { class: "close-x", attrs: { "aria-label": "Close" }, text: "✕", on: { click: closeModal } })
    ]));

    var dots = el("div", { class: "detail-phase-dots" });
    (r.phases||[]).forEach(function(pid){
      var p = PHASE_MAP[pid];
      if (!p) return;
      dots.appendChild(el("span", { style: "background:" + p.color, text: p.label }));
    });
    wrap.appendChild(dots);

    if ((r.tags||[]).length) wrap.appendChild(el("div", { class: "tags", text: (r.tags||[]).join(" · ") }));
    wrap.appendChild(el("div", { class: "meta-line", style: "margin-top:8px;", text: "Added by " + (r.addedByName || "someone") + (r.prepMinutes ? " · " + r.prepMinutes + " min" : "") }));

    var ingSection = el("div", { class: "detail-section" }, [ el("h4", { text: "Ingredients" }) ]);
    var ul = el("ul", { class: "ingredient-list" });
    (r.ingredients||[]).forEach(function(i){ ul.appendChild(el("li", { text: i })); });
    ingSection.appendChild(ul);
    wrap.appendChild(ingSection);

    if (r.instructions) {
      wrap.appendChild(el("div", { class: "detail-section" }, [
        el("h4", { text: "Instructions" }),
        el("div", { class: "instructions", text: r.instructions })
      ]));
    }

    var summary = ratingSummary(r.id);
    var ratingSection = el("div", { class: "detail-section" }, [ el("h4", { text: "Ratings" }) ]);
    if (summary) {
      ratingSection.appendChild(el("div", { style: "margin-bottom:8px;" }, [
        el("span", { class: "stars", text: starString(summary.avg) }),
        document.createTextNode(" " + summary.avg.toFixed(1) + " · " + summary.count + " rating" + (summary.count > 1 ? "s" : ""))
      ]));
    }
    var rs = ratingsFor(r.id).sort(function(a,b){ return (b.createdAt||0) - (a.createdAt||0); });
    if (!rs.length) {
      ratingSection.appendChild(el("div", { style: "color:var(--ink-faint); font-size:14px;", text: "No ratings yet." }));
    }
    rs.forEach(function(rt){
      var item = el("div", { class: "rating-item" });
      var head = el("div", { class: "rhead" }, [
        el("span", { class: "who" }, [
          document.createTextNode(rt.name + " "),
          el("span", { class: "stars", text: starString(rt.stars) })
        ]),
        el("span", { class: "tol", text: TOL_MAP[rt.tolerance] ? TOL_MAP[rt.tolerance].label : "" })
      ]);
      item.appendChild(head);
      if (rt.comment) item.appendChild(el("div", { class: "comment", text: rt.comment }));
      ratingSection.appendChild(item);
    });
    wrap.appendChild(ratingSection);

    if (state.myProfile && state.myProfile.role === "patient") {
      wrap.appendChild(renderRatingForm(m, r));
    } else {
      wrap.appendChild(el("div", { class: "helper-banner", text: "Only the patient role can rate recipes. Switch your role from the profile chip if that's you." }));
    }

    return wrap;
  }

  function renderRatingForm(m, r) {
    var existing = state.ratings.find(function(rt){ return rt.recipeId === r.id && rt.uid === state.uid; });
    if (m.ratingStars === 0 && existing) { m.ratingStars = existing.stars; m.ratingTol = existing.tolerance; m.ratingComment = existing.comment || ""; }

    var section = el("div", { class: "detail-section" }, [ el("h4", { text: existing ? "Update your rating" : "Rate this recipe" }) ]);

    var picker = el("div", { class: "star-picker", attrs: { role: "radiogroup", "aria-label": "Star rating" } });
    for (var i = 1; i <= 5; i++) {
      (function(val){
        var b = el("button", { attrs: { type: "button", "aria-label": val + " stars" }, text: "★" });
        b.dataset.on = String(val <= m.ratingStars);
        b.addEventListener("click", function(){ m.ratingStars = val; renderModalInPlace(); });
        picker.appendChild(b);
      })(i);
    }
    section.appendChild(picker);

    var tolRow = el("div", { class: "tol-picker", style: "margin-top:10px;" });
    TOLERANCE.forEach(function(t){
      var b = el("button", { class: "tol-btn", attrs: { type: "button" }, text: t.label });
      b.dataset.on = String(m.ratingTol === t.id);
      b.addEventListener("click", function(){ m.ratingTol = t.id; renderModalInPlace(); });
      tolRow.appendChild(b);
    });
    section.appendChild(tolRow);

    var commentArea = el("textarea", { attrs: { placeholder: "Anything worth noting? (optional)" }, style: "margin-top:10px;" });
    commentArea.value = m.ratingComment;
    commentArea.addEventListener("input", function(e){ m.ratingComment = e.target.value; });
    section.appendChild(commentArea);

    if (m.ratingError) section.appendChild(el("div", { class: "form-error", text: m.ratingError }));

    section.appendChild(el("button", {
      class: "btn btn-primary btn-block", style: "margin-top:12px;",
      attrs: { type: "button" }, text: existing ? "Update rating" : "Save rating",
      on: { click: function(){ submitRating(m, r); } }
    }));
    return section;
  }

  function submitRating(m, r) {
    if (!m.ratingStars) { m.ratingError = "Pick a star rating."; renderModalInPlace(); return; }
    if (!m.ratingTol) { m.ratingError = "Pick how well it was tolerated."; renderModalInPlace(); return; }
    m.ratingError = "";
    var data = {
      recipeId: r.id,
      uid: state.uid,
      name: state.myProfile.name,
      stars: m.ratingStars,
      tolerance: m.ratingTol,
      comment: m.ratingComment.trim(),
      createdAt: Date.now()
    };
    Backend.upsertRating(r.id, state.uid, data).then(function(){
      renderModalInPlace();
    }).catch(function(){
      m.ratingError = "Couldn't save — check your connection and try again.";
      renderModalInPlace();
    });
  }

  // ---------------- data wiring (Backend only, no capability calls here) ----------------

  function subscribe() {
    Backend.onRecipes(function (recipes) {
      state.recipes = recipes;
      render();
    });

    Backend.onRatings(function (ratings) {
      state.ratings = ratings;
      render();
    });

    Backend.onMembers(function (members) {
      var map = {};
      members.forEach(function (d) { map[d.id] = d; });
      state.members = map;
      if (state.uid && map[state.uid]) state.myProfile = map[state.uid];
      render();
    });
  }

  var subscribed = false;

  async function afterSignedIn(uid) {
    state.uid = uid;
    state.myProfile = await Backend.fetchProfile(uid);

    var filterState = await Backend.fetchFilterState(uid);
    if (filterState && filterState.lastPhase) state.activePhase = filterState.lastPhase;

    if (!subscribed) { subscribe(); subscribed = true; }
    render();
  }

  async function init() {
    var watchdog = setTimeout(function(){
      if (!state.ready && !state.capsMissing) { state.slowLoad = true; render(); }
    }, 12000);

    try {
      var conn = await Backend.connect();
      if (!conn.ok) { clearTimeout(watchdog); state.capsMissing = true; render(); return; }

      var uid = await Backend.getUid(); // creates an anonymous session on first visit
      clearTimeout(watchdog);
      state.ready = true;

      if (uid) {
        await afterSignedIn(uid);
      } else {
        state.uid = null;
        render();
      }
    } catch (e) {
      clearTimeout(watchdog);
      state.capsMissing = true;
      render();
    }
  }

  render();
  init();
})();
</script>
</body>
</html>
